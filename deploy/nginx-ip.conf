# Temporary HTTPS IP entry. Keep existing domain virtual hosts and HTTP IP app.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 115.190.128.235;
    ssl_certificate /etc/letsencrypt-ziwei/live/ziwei-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt-ziwei/live/ziwei-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 128k;

    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 200s;
        proxy_buffering off;
    }
}
